# Automatic Claude review on every pull request: inline comments on issues it
# finds, or one summary comment if it finds none. Skips drafts, closed PRs and
# PRs Claude has already commented on. See
# https://code.claude.com/docs/en/github-actions#run-a-skill
#
# Uses the same CLAUDE_CODE_OAUTH_TOKEN secret as claude.yml. GitHub doesn't
# pass secrets to PRs from forks, so only PRs from branches in this repo are
# reviewed.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review at a time per PR; a new push cancels the review of the old one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required even though the skill names this tool: the action only
          # starts the inline-comment MCP server when --allowedTools lists it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
